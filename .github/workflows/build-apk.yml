
name: Build ZIKRI Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zikri-mobile-build.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: uses: actions/setup-java@v5

        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project ZIP
        run: |
          mkdir extracted
          unzip -q zikri-mobile-build.zip -d extracted
          PROJECT_DIR=$(dirname "$(find extracted -name package.json -not -path '*/node_modules/*' | head -n 1)")
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "extracted" ]; then
            PROJECT_DIR=extracted
          fi
          cp -R "$PROJECT_DIR"/. .

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Prepare Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIKRI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
