
name: Build ZIKRI Android APK

"on":
  workflow_dispatch:
  push:
    paths: ["*.zip", ".github/workflows/build-apk.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP file not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          PACKAGE_FILE=$(find extracted -name package.json | head -n 1)
          if [ -z "$PACKAGE_FILE" ]; then
            echo "package.json not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PACKAGE_FILE")
          cp -R "$PROJECT_DIR"/. .

      - name: Install dependencies
        run: npm install

      - name: Build website
        run: npm run build

      - name: Add Android
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIKRI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

